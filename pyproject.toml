[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wormdrive"
version = "0.1.0"
description = "A nematode-inspired camera-to-robot bridge (C. elegans locomotion circuit demonstrator)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
camera = ["opencv-python>=4.8"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
wormdrive = "wormdrive.main:main"

[tool.setuptools.packages.find]
where = ["src"]
